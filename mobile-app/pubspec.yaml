name: vmonitor
description: vmonitor smartphone app - use your phone as a virtual monitor for Windows PC.
# PC 側 (VMonitor.UI) と揃える。食い違うと、不具合報告を受けたときに
# どちらの組み合わせなのか分からなくなる。
# '+' の後ろは versionCode。配布するたびに 1 つ増やす。
version: 1.2.0-beta+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # 多言語対応。訳文は l10n/*.arb に置き、flutter gen-l10n が
  # AppLocalizations を作る。言語を足すときは arb を 1 つ増やすだけ。
  flutter_localizations:
    sdk: flutter
  intl: any
  multicast_dns: ^0.3.2+1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  # fast_check は pub.dev に存在しないため glados を使用する
  # (PBT タスク 8.2, 8.3 で使用)
  glados: ^1.1.7
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
