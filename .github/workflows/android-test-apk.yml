name: Android 検証用 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter
        run: |
          git clone --depth 1 -b 3.41.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Dependencies
        working-directory: mobile-app
        run: flutter pub get
      - name: Test connection transports
        working-directory: mobile-app
        run: flutter test test/transport test/widget_test.dart
      - name: Build test APK (debug signing)
        working-directory: mobile-app
        run: flutter build apk --debug --no-pub
      - name: Package
        id: package
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' mobile-app/pubspec.yaml)
          name="vmonitor-${version}-android-test.apk"
          mkdir -p output
          cp mobile-app/build/app/outputs/flutter-apk/app-debug.apk "output/$name"
          (cd output && sha256sum "$name" > "$name.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: output/*
          retention-days: 30
