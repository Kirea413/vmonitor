name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        working-directory: pc-client
        run: dotnet test VMonitor.Tests/VMonitor.Tests.csproj --configuration Release

  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        run: |
          git clone --depth 1 -b 3.41.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Dependencies
        working-directory: mobile-app
        run: flutter pub get
      - name: Analyze
        working-directory: mobile-app
        run: flutter analyze --no-fatal-infos
      - name: Test
        working-directory: mobile-app
        run: flutter test
